{{- $pg := .Values.postgres }}
{{- if and $pg.enabled (eq $pg.mode "bundled") }}
{{- $name := include "signal-lab.componentName" (dict "ctx" $ "component" "postgres") }}
{{- if not $pg.auth.existingSecret }}
{{- /* Generate the password once and keep it across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := $pg.auth.password | default (and $existing (index $existing.data "password" | b64dec)) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "postgres") | nindent 2 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "postgres") | nindent 2 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-lab.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      {{- with include "signal-lab.imagePullSecrets" . }}{{- . | trim | nindent 6 }}{{- end }}
      serviceAccountName: {{ include "signal-lab.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $pg.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "signal-lab.image" (dict "image" $pg.image "global" .Values.global "defaultTag" "17-alpine") | quote }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.auth.existingSecret | default $name }}
                  key: {{ $pg.auth.existingSecretKey | default "password" }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 15
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $pg.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with include "signal-lab.scheduling" $pg }}{{- . | trim | nindent 6 }}{{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "postgres") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with include "signal-lab.storageClass" $pg.persistence }}{{- . | trim | nindent 8 }}{{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "postgres") | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
{{- end }}
{{- if and .Values.lab.auth.admin.username .Values.lab.auth.admin.password (not .Values.lab.auth.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "admin") | nindent 2 }}
type: Opaque
data:
  password: {{ .Values.lab.auth.admin.password | b64enc | quote }}
{{- end }}
