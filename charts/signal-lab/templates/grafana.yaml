{{- if include "signal-lab.grafanaBundled" . }}
{{- $g := .Values.backends.victoriametrics.grafana }}
{{- $name := include "signal-lab.componentName" (dict "ctx" $ "component" "grafana") }}
{{- $dashboards := .Files.Glob "files/grafana/dashboards/*.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "grafana" "name" (printf "%s-provisioning" $name)) | nindent 2 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus          # VictoriaMetrics speaks the Prometheus HTTP API
        access: proxy
        url: {{ include "signal-lab.svcUrl" (dict "ctx" $ "component" "victoriametrics" "port" 8428) }}
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: 5s
  {{- if $dashboards }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: signal-lab
        folder: Signal Lab
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/signal-lab
  {{- end }}
{{- if $dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "grafana" "name" (printf "%s-dashboards" $name)) | nindent 2 }}
data:
  {{- range $path, $_ := $dashboards }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "grafana") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-lab.componentLabels" (dict "ctx" $ "component" "grafana") | nindent 8 }}
      annotations:
        checksum/provisioning: {{ printf "%s%s" (toYaml $dashboards) (include "signal-lab.svcUrl" (dict "ctx" $ "component" "victoriametrics" "port" 8428)) | sha256sum }}
    spec:
      {{- with include "signal-lab.imagePullSecrets" . }}{{- . | trim | nindent 6 }}{{- end }}
      serviceAccountName: {{ include "signal-lab.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      enableServiceLinks: false
      {{- with $g.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ include "signal-lab.image" (dict "image" $g.image "global" .Values.global "defaultTag" "latest") | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          env:
            {{- if $g.anonymousAdmin }}
            # Anonymous admin, no login form: fine for a personal lab, not for a shared one.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            {{- end }}
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: {{ include "signal-lab.publicUrl" (dict "ctx" $ "override" $g.publicUrl "host" "grafana" "port" 3000) | quote }}
            {{- range $k, $v := $g.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          {{- with $g.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $g.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            {{- if $dashboards }}
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/signal-lab
              readOnly: true
            {{- end }}
      volumes:
        - name: storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: {{ $name }}-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        {{- if $dashboards }}
        - name: dashboard-providers
          configMap:
            name: {{ $name }}-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: {{ $name }}-dashboards
        {{- end }}
      {{- with include "signal-lab.scheduling" $g }}{{- . | trim | nindent 6 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "grafana") | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
