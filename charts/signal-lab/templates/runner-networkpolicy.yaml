{{- $np := .Values.runner.networkPolicy }}
{{- if $np.enabled }}
# The runner executes untrusted learner code. It may only be called by the lab,
# and may only talk to the Collector, the shop services and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "runner") | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "runner") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "lab") | nindent 14 }}
      ports:
        - port: {{ .Values.runner.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "collector") | nindent 14 }}
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    {{- if .Values.scenario.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "scenario") | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with $np.dnsTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
