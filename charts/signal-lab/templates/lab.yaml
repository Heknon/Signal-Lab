{{- $l := .Values.lab }}
{{- $confDir := include "signal-lab.labCollectorConfDir" . }}
{{- $configs := list }}
{{- range splitList "," (include "signal-lab.collectorConfigFiles" .) }}
{{- $configs = append $configs (printf "%s/%s" $confDir .) }}
{{- end }}
{{- $collector := include "signal-lab.componentName" (dict "ctx" $ "component" "collector") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "lab") | nindent 2 }}
spec:
  replicas: {{ $l.replicaCount }}
  selector:
    matchLabels:
      {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "lab") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signal-lab.componentLabels" (dict "ctx" $ "component" "lab") | nindent 8 }}
        {{- with $l.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $l.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "signal-lab.imagePullSecrets" . }}{{- . | trim | nindent 6 }}{{- end }}
      serviceAccountName: {{ include "signal-lab.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lab
          image: {{ include "signal-lab.image" (dict "image" .Values.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          env:
            - name: SIGNAL_LAB_PORT
              value: "8000"
            - name: SIGNAL_LAB_ENVIRONMENT
              value: {{ $l.environment | quote }}
            - name: SIGNAL_LAB_LOG_LEVEL
              value: {{ $l.logLevel | quote }}
            - name: SIGNAL_LAB_RELOAD
              value: "false"
            - name: SIGNAL_LAB_BACKENDS
              value: {{ include "signal-lab.enabledBackends" . | quote }}
            {{- with $l.lessonPacks }}
            - name: SIGNAL_LAB_LESSON_PACKS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: SIGNAL_LAB_RUNNER_URL
              value: {{ include "signal-lab.svcUrl" (dict "ctx" $ "component" "runner" "port" .Values.runner.service.port) | quote }}
            {{- $auth := $l.auth }}
            - name: SIGNAL_LAB_AUTH
              value: {{ $auth.mode | quote }}
            - name: SIGNAL_LAB_SIGNUP
              value: {{ $auth.signup | quote }}
            - name: SIGNAL_LAB_COOKIE_SECURE
              value: {{ $auth.cookieSecure | toString | quote }}
            - name: SIGNAL_LAB_SCENARIO_CONTROL
              value: {{ $auth.scenarioControl | quote }}
            - name: SIGNAL_LAB_FAULT_TTL
              value: {{ $auth.faultTtl | toString | quote }}
            {{- if $auth.admin.username }}
            - name: SIGNAL_LAB_ADMIN_USERNAME
              value: {{ $auth.admin.username | quote }}
            {{- if or $auth.admin.existingSecret $auth.admin.password }}
            - name: SIGNAL_LAB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $auth.admin.existingSecret | default (include "signal-lab.componentName" (dict "ctx" $ "component" "admin")) }}
                  key: {{ if $auth.admin.existingSecret }}{{ $auth.admin.existingSecretKey }}{{ else }}password{{ end }}
            {{- end }}
            {{- end }}
            {{- $pg := .Values.postgres }}
            {{- if $pg.enabled }}
            {{- if eq $pg.mode "bundled" }}
            - name: SL_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.auth.existingSecret | default (include "signal-lab.componentName" (dict "ctx" $ "component" "postgres")) }}
                  key: {{ if $pg.auth.existingSecret }}{{ $pg.auth.existingSecretKey }}{{ else }}password{{ end }}
            - name: SIGNAL_LAB_DATABASE_URL
              value: {{ printf "postgresql://%s:$(SL_PG_PASSWORD)@%s:5432/%s" $pg.auth.username (include "signal-lab.componentName" (dict "ctx" $ "component" "postgres")) $pg.auth.database | quote }}
            {{- else if $pg.external.existingSecret }}
            - name: SIGNAL_LAB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.external.existingSecret }}
                  key: {{ $pg.external.existingSecretKey }}
            {{- else }}
            - name: SIGNAL_LAB_DATABASE_URL
              value: {{ required "postgres.external.url or postgres.external.existingSecret is required when postgres.mode=external" $pg.external.url | quote }}
            {{- end }}
            {{- end }}
            - name: SIGNAL_LAB_RUNS_ENABLED
              value: {{ $l.runs.enabled | toString | quote }}
            - name: SIGNAL_LAB_RUN_TIMEOUT
              value: {{ $l.runs.timeout | toString | quote }}
            - name: SIGNAL_LAB_OTLP_ENDPOINT
              value: {{ printf "http://%s:4318" $collector | quote }}
            - name: SIGNAL_LAB_COLLECTOR_HEALTH_URL
              value: {{ printf "http://%s:13133/" $collector | quote }}
            - name: SIGNAL_LAB_COLLECTOR_CONFIGS
              value: {{ join "," $configs | quote }}
            {{- if .Values.scenario.enabled }}
            - name: SIGNAL_LAB_SCENARIOS
              value: shop
            {{- with include "signal-lab.shopUrlEnv" . }}{{- . | trim | nindent 12 }}{{- end }}
            {{- end }}
            {{- with include "signal-lab.backendLabEnv" . }}{{- . | trim | nindent 12 }}{{- end }}
            {{- with $l.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          {{- with $l.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: collector-config
              mountPath: {{ $confDir }}
              readOnly: true
            {{- with $l.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: collector-config
          configMap:
            name: {{ $collector }}
        {{- with $l.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with include "signal-lab.scheduling" $l }}{{- . | trim | nindent 6 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "signal-lab.metadata" (dict "ctx" $ "component" "lab" "annotations" $l.service.annotations) | nindent 2 }}
spec:
  type: {{ $l.service.type }}
  selector:
    {{- include "signal-lab.componentSelectorLabels" (dict "ctx" $ "component" "lab") | nindent 4 }}
  ports:
    - name: http
      port: {{ $l.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
