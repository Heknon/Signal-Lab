# VictoriaLogs ingests OTLP logs natively. Resource and log attributes become
# fields with their dotted names (service.name, app.order.id, ...).
exporters:
  otlphttp/victorialogs:
    logs_endpoint: ${env:VICTORIALOGS_OTLP_URL:-http://victorialogs:9428/insert/opentelemetry/v1/logs}
    compression: gzip

service:
  pipelines:
    logs/victorialogs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs]
