processors:
  batch:
    timeout: 200ms
  attributes/scrub:
    actions:
      - key: app.card.number
        action: hash
      - key: user.email
        action: hash

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlphttp/lab]
