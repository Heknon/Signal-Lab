services:
  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:-victoriametrics/victoria-metrics:v1.106.1}
    command:
      - -retentionPeriod=7d
      - -search.latencyOffset=1s
      # OTLP names like http.server.request.duration become
      # http_server_request_duration_seconds, as Prometheus users expect.
      - -opentelemetry.usePrometheusNaming
    ports: ["8428:8428"]
    volumes: [vm-data:/victoria-metrics-data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      retries: 20

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["3000:3000"]
    volumes:
      - ./plugins/backends/victoriametrics/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./plugins/backends/victoriametrics/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [victoriametrics]

  lab:
    environment:
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      GRAFANA_URL: http://grafana:3000

volumes:
  vm-data:
