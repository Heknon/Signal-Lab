# Needs the VictoriaLogs data source plugin (victoriametrics-logs-datasource),
# installed by GF_PLUGINS_PREINSTALL in compose.yaml.
apiVersion: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: false
    jsonData:
      maxLines: 1000
