id: victorialogs
title: VictoriaLogs
vendor: VictoriaMetrics
description: >
  A log database that ingests OTLP natively and stores every attribute as a
  field. Query with LogsQL in its built-in VMUI or in Grafana Explore.
color: "#7C3AED"
capabilities: [logs]
query_languages: [logsql]
components:
  - {id: victorialogs, title: VictoriaLogs, role: Log storage & VMUI}

settings:
  victorialogs_url:        {env: VICTORIALOGS_URL, default: "http://victorialogs:9428"}
  victorialogs_public_url: {env: VICTORIALOGS_PUBLIC_URL, default: "http://localhost:9428"}
  grafana_public_url:      {env: GRAFANA_PUBLIC_URL, default: "http://localhost:3000"}

links:
  - {id: explore, label: VMUI, url: "{victorialogs_public_url}/select/vmui/", description: VictoriaLogs' built-in LogsQL UI}
  # Explore with the provisioned VictoriaLogs data source (uid victorialogs) selected.
  - {id: grafana, label: Grafana Explore, url: "{grafana_public_url}/explore?schemaVersion=1&orgId=1&panes=%7B%22vl%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22victoriametrics-logs-datasource%22%2C%22uid%22%3A%22victorialogs%22%7D%2C%22expr%22%3A%22%2A%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-15m%22%2C%22to%22%3A%22now%22%7D%7D%7D", description: Logs in Grafana with the VictoriaLogs data source}

# Read-only passthrough for field-name and field-value autocomplete.
proxy:
  target: victorialogs_url
  allow: ["select/logsql/field_names", "select/logsql/field_values", "select/logsql/stream_field_names"]
