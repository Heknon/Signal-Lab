processors:
  batch:
    timeout: 200ms
  transform/legacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["url.path"], attributes["http.target"]) where attributes["http.target"] != nil
          - replace_pattern(attributes["url.path"], "\\?.*", "")
          - delete_key(attributes, "http.target")
      - context: resource
        statements:
          - set(attributes["service.namespace"], "shop")

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/legacy, batch]
      exporters: [otlphttp/lab]
