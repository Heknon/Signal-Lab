name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: pw}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest -q server/tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.4.4}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.16.3}
      - run: scripts/sync-chart.sh --check
      - run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          for f in "" charts/signal-lab/ci/*.yaml; do
            helm lint --strict charts/signal-lab ${f:+-f $f}
            helm template t charts/signal-lab ${f:+-f $f} | ~/go/bin/kubeconform -strict -summary -kubernetes-version 1.30.0
          done

  e2e:
    # Brings up the default stack and runs every lesson and incident check.
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build lab
      - run: docker compose up -d
      - run: |
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health >/dev/null && break; sleep 5; done
          sleep 30
      - run: python3 scripts/test_lessons.py
      - run: pip install pyyaml && python3 scripts/test_mistakes.py   # known mistakes fail, valid alternatives pass
      - run: pip install pyyaml && python3 scripts/test_incidents.py
        if: github.event_name != 'pull_request'
      - if: failure()
        run: docker compose logs --tail 200

  image:
    if: github.event_name == 'push'
    needs: [server, web, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
